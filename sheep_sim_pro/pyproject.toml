[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sheep-sim"
version = "1.0.0"
description = "Agent-based domestic sheep movement simulation for abundant and scarce field environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent-based model", "sheep", "movement ecology", "foraging", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pandas-stubs",
]
notebook = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "seaborn>=0.13",
]

[project.scripts]
sheep-sim = "sheep_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sheep_sim*"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore  = [
    "E501",   # line too long — ruff format handles this
    "N803",   # argument name should be lowercase (allow short math vars)
    "N806",   # variable in function should be lowercase
    "SIM108", # ternary operator — readability preference
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts       = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source  = ["sheep_sim"]
omit    = ["sheep_sim/rendering/*", "sheep_sim/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered  = false
fail_under    = 70

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version        = "3.11"
strict                = false
warn_return_any       = true
warn_unused_ignores   = true
ignore_missing_imports = true
